<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Locator Pro</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --primary-accent: #0056b3; 
      --bg: #f4f6f9; 
      --panel: #ffffff;
      --text: #333333;
      --muted: #666666;
      --border: #dbe2ef;
      --th-bg: #f1f5f9;
      --accent-green: #10b981;
    }
    [data-theme="dark"] {
      --primary-accent: #3b82f6;
      --bg: #0f1115;
      --panel: #161a22;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #2d3748;
      --th-bg: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      padding: 12px; 
      padding-bottom: 90px; 
      transition: background-color 0.2s ease;
    }

    .app-container { max-width: 750px; margin: 0 auto; }

    /* Premium Navigation Tabs */
    .tabs-bar { 
      display: flex; 
      background: var(--panel); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 5px; 
      margin-bottom: 14px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
    }
    .tab-btn { 
      flex: 1; 
      padding: 14px; 
      text-align: center; 
      font-size: 15px; 
      font-weight: 700; 
      border: none; 
      background: transparent; 
      color: var(--muted); 
      cursor: pointer; 
      border-radius: 8px; 
      transition: all 0.2s ease; 
    }
    
    #finderTab.active { background: #0056b3; color: white; }
    #counterTab.active { background: var(--accent-green); color: white; }

    .app-screen { display: none; }
    .app-screen.active { display: block; }

    /* Outer Panel Container styling */
    .panel-box { 
      background: var(--panel); 
      padding: 20px; 
      border-radius: 12px; 
      border: 1px solid var(--border); 
      box-shadow: 0 4px 10px rgba(0,0,0,0.04); 
      margin-bottom: 16px; 
    }

    .input-group {
      margin-bottom: 14px;
    }

    label { 
      font-weight: 700; 
      font-size: 12px; 
      color: #4a5568; 
      display: block; 
      margin-bottom: 6px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }
    
    input[type="text"], input[type="number"] { 
      width: 100%; 
      padding: 14px; 
      font-size: 16px; 
      border: 2px solid var(--border); 
      border-radius: 8px; 
      background: var(--panel); 
      color: var(--text);
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: var(--primary-accent); }

    /* Action Row Buttons */
    .shortcut-row { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 10px; 
      margin-top: 14px; 
    }
    .action-sub-btn { 
      padding: 12px; 
      font-size: 14px; 
      font-weight: 600; 
      color: white; 
      background: #198754; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      text-align: center;
    }
    .action-sub-btn.reset { background: #4a5568; }
    .shortcut-row .reset { grid-column: span 2; }

    /* Preferences Configuration panel */
    .preferences-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-top: 14px; 
      padding-top: 12px; 
      border-top: 1px dashed var(--border); 
      font-size: 13px; 
    }
    .accent-picker-wrap { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .color-box-input { width: 34px; height: 26px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; background: none; }

    /* Sync and Cache Utility Metadata Strip */
    .sync-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .clear-cache-link {
      color: #dc3545;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .clear-cache-link:hover { text-decoration: underline; }

    /* Clean Column Alignments and Grid Borders */
    .table-wrap { 
      overflow-x: auto; 
      background: var(--panel); 
      border-radius: 12px; 
      border: 1px solid var(--border); 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
    th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: middle; word-wrap: break-word; }
    th:last-child, td:last-child { border-right: none; }
    
    th { background: var(--th-bg); font-weight: 700; color: var(--muted); font-size: 13px; }
    
    th.col-main, td.col-main { width: 55%; }
    th.col-qty, td.col-qty { width: 18%; text-align: center; }
    th.col-sub, td.col-sub { width: 27%; text-align: center; }

    mark.match { background: #ffeb3b; color: #000; padding: 1px 3px; border-radius: 3px; font-weight: bold; }
    [data-theme="dark"] mark.match { background: #f59e0b; }
    
    .location-badge { 
      background: #10b981; 
      color: white; 
      padding: 6px 8px; 
      border-radius: 6px; 
      font-weight: 700; 
      font-size: 12px; 
      display: inline-block; 
      text-align: center;
      max-width: 100%;
    }
    .location-badge.fittings-badge {
      background: #8b5cf6; /* Distinct purple color badge for fittings locator */
    }

    .alertBox { 
      display: none; background: #fff3cd; color: #856404; padding: 16px; border-radius: 8px; 
      text-align: center; font-weight: bold; margin-top: 12px; border: 1px solid #ffeeba;
    }

    /* Precount Scan Overlay Components */
    #reader { width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
    .count-overlay { display: none; background: var(--panel); border: 2px solid var(--accent-green); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .count-title { font-size: 12px; font-weight: bold; color: var(--muted); text-transform: uppercase; }
    .count-item-name { font-size: 19px; font-weight: 800; margin: 4px 0; }
    .count-sub { display: inline-block; background: #e0f2fe; color: #0369a1; font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 12px; }
    
    .input-row { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; }
    .qty-input { flex: 1; font-size: 22px; font-weight: bold; text-align: center; }
    .mod-btn { padding: 12px; font-size: 15px; font-weight: bold; border: 1px solid var(--border); background: var(--th-bg); color: var(--text); border-radius: 6px; cursor: pointer; }

    .action-row { display: flex; gap: 6px; }
    .btn { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .btn-save { background: var(--accent-green); color: white; }
    .btn-cancel { background: #dc3545; color: white; }

    .log-item { background: var(--panel); padding: 12px; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .clear-btn { background: none; border: none; color: #dc3545; cursor: pointer; font-weight: 600; padding: 4px; }

    .footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 12px; display: flex; justify-content: center; z-index: 999; }
    .export-btn { width: 100%; max-width: 726px; background: #0d6efd; color: white; padding: 14px; border-radius: 8px; text-align: center; font-weight: bold; border: none; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  
  <div class="tabs-bar">
    <button id="finderTab" class="tab-btn active" onclick="switchMode('finder')">🔍 Find Stock</button>
    <button id="counterTab" class="tab-btn" onclick="switchMode('counter')">📋 Pre-Count Scanner</button>
  </div>

  <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; padding: 0 4px;">
    <div id="metaDisplay">Loading database files...</div>
    <div id="countSession" style="display:none;">Counts logged: 0</div>
  </div>

  <div id="finderScreen" class="app-screen active">
    <div class="panel-box">
      <div class="input-group">
        <label for="searchBox">Search Part Number / Item No. / Supplier Reference</label>
        <input id="searchBox" type="text" placeholder="DGN 3102C..." autofocus autocomplete="off"/>
      </div>

      <div class="input-group">
        <label for="fittingsSearchBox" style="color: #8b5cf6;">Search Part Number (For Fittings Stock)</label>
        <input id="fittingsSearchBox" type="text" placeholder="15612-16-16N..." autocomplete="off"/>
      </div>
      
      <div class="shortcut-row">
        <button class="action-sub-btn" onclick="triggerDirectScan('part')">Scan QR Code</button>
        <button class="action-sub-btn" onclick="triggerDirectScan('ref')">Scan Supplier Ref</button>
        <button class="action-sub-btn reset" onclick="resetSearchFields()">Reset Search Fields</button>
      </div>

      <div class="preferences-bar">
        <div class="accent-picker-wrap">
          <span>Background tone color</span>
          <input id="accentColorPicker" type="color" class="color-box-input" value="#f4f6f9" />
        </div>
        <div>
          <input id="themeToggle" type="checkbox" />
          <label for="themeToggle" style="display:inline; margin-left:4px; font-weight:600; color:var(--text); text-transform:none;">Dark Mode</label>
        </div>
      </div>

      <div class="sync-status-row">
        <span id="liveSyncDisplay">Live Sync: Connecting...</span>
        <button class="clear-cache-link" onclick="clearAppCache()">Clear App Cache</button>
      </div>
    </div>

    <div class="results-container">
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th class="col-main">Part Number Map / Cross-Ref</th>
              <th class="col-qty">Stock</th>
              <th class="col-sub">SubLocation</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="noResults" class="alertBox">❌ No matching inventory items found.</div>
    </div>
  </div>

  <div id="counterScreen" class="app-screen">
    <div class="panel-box" style="padding:8px; margin-bottom:12px;">
      <div id="reader"></div>
    </div>

    <div id="countOverlay" class="count-overlay">
      <div id="targetTitleHeader" class="count-title">Matched Database Reference</div>
      <div id="targetItemName" class="count-item-name">---</div>
      <div id="targetMappingInfo" style="font-size:12px; color:var(--muted); margin-bottom:8px;">---</div>
      <div id="targetSubLoc" class="count-sub">---</div>
      
      <div class="input-row">
        <button class="mod-btn" onclick="adjustQty(-1)">-1</button>
        <input id="qtyInputField" type="number" class="qty-input" placeholder="0" min="0" inputmode="numeric"/>
        <button class="mod-btn" onclick="adjustQty(1)">+1</button>
        <button class="mod-btn" onclick="adjustQty(10)">+10</button>
      </div>

      <div class="action-row">
        <button class="btn btn-cancel" onclick="dismissOverlay()">Cancel</button>
        <button class="btn btn-save" onclick="commitCount()">Save Count</button>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin:14px 0 8px 0;">
      <span style="font-size: 14px; font-weight: 700; color: var(--muted);">Logged in this Session</span>
      <button class="clear-btn" onclick="clearCounts()">Clear Logs</button>
    </div>
    <div id="logRegistryList"></div>
  </div>

</div>

<div id="footerBar" class="footer-bar" style="display: none;">
  <button class="export-btn" onclick="exportCountsToCSV()">Download Counts (.CSV)</button>
</div>

<script>
// Main Inventory source and New Fittings source URLs
const CSV_URL = 'https://raw.githubusercontent.com/wh-sec/stock-locator-pwa/main/stocks.csv';
const FITTINGS_CSV_URL = 'https://raw.githubusercontent.com/wh-sec/stock-locator-pwa/main/fittings.csv';

var stockRegistry = [];
var fittingsRegistry = [];
var countLogSession = [];
var activeScanMatch = null;
var html5QrcodeScanner = null;

var searchBox = document.getElementById('searchBox');
var fittingsSearchBox = document.getElementById('fittingsSearchBox');
var tableBody = document.getElementById('tableBody');
var tableWrap = document.getElementById('tableWrap');
var noResults = document.getElementById('noResults');
var metaDisplay = document.getElementById('metaDisplay');
var liveSyncDisplay = document.getElementById('liveSyncDisplay');
var themeToggle = document.getElementById('themeToggle');
var accentColorPicker = document.getElementById('accentColorPicker');
var searchTimeout = null;

function applyBackgroundTone(hexColor) {
  localStorage.setItem('ms_bg_hex', hexColor);
  if (!themeToggle.checked) {
    document.documentElement.style.setProperty('--bg', hexColor);
  }
}

accentColorPicker.addEventListener('input', function() {
  applyBackgroundTone(accentColorPicker.value);
});

function resetSearchFields() {
  searchBox.value = '';
  fittingsSearchBox.value = '';
  renderResults();
  searchBox.focus();
}

function triggerDirectScan(type) {
  switchMode('counter');
}

function switchMode(mode) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.app-screen').forEach(scr => scr.classList.remove('active'));
  
  if (mode === 'finder') {
    document.getElementById('finderTab').classList.add('active');
    document.getElementById('finderScreen').classList.add('active');
    document.getElementById('footerBar').style.display = 'none';
    document.getElementById('countSession').style.display = 'none';
    updateMetaDisplay();
    stopScanner();
    setTimeout(() => { searchBox.focus(); }, 100);
  } else {
    document.getElementById('counterTab').classList.add('active');
    document.getElementById('counterScreen').classList.add('active');
    document.getElementById('footerBar').style.display = 'flex';
    document.getElementById('countSession').style.display = 'block';
    document.getElementById('countSession').textContent = `Counts logged: ${countLogSession.length}`;
    startScanner();
  }
}

function updateMetaDisplay() {
  metaDisplay.textContent = `Main items: ${stockRegistry.length} | Fittings: ${fittingsRegistry.length}`;
}

// Parses standard inventory stocks.csv
function parseCSV(text) {
  var lines = text.split(/\r?\n/);
  var rows = [];
  if (lines.length < 2) return [];
  for (var i = 1; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
    if (cols.length < 6) continue;
    var qtyRaw = cols[4] || '0';
    var qty = parseInt(qtyRaw.replace(/[^0-9.\-]/g, ''), 10);
    if (isNaN(qty)) qty = 0;
    rows.push({
      part: (cols[3] || '').replace(/"/g, '').trim(),
      qty: qty,
      sub: (cols[5] || '').replace(/"/g, '').trim(),
      itemNo: (cols[6] || '').replace(/"/g, '').trim(),
      supplierRef: (cols[1] || '').replace(/"/g, '').trim(),
      type: 'standard'
    });
  }
  return rows;
}

// Parses new fittings format based on structure: Col 2 (Part), Col 6 (Total), Col 7 (Locator)
function parseFittingsCSV(text) {
  var lines = text.split(/\r?\n/);
  var rows = [];
  if (lines.length < 2) return [];
  for (var i = 1; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
    if (cols.length < 8) continue; // Ensure we have enough columns to fetch locator
    
    var qtyRaw = cols[6] || '0'; // TOTAL column field index 6
    var qty = parseInt(qtyRaw.replace(/[^0-9.\-]/g, ''), 10);
    if (isNaN(qty)) qty = 0;
    
    rows.push({
      part: (cols[2] || '').replace(/"/g, '').trim(), // PART NUMBER column field index 2
      qty: qty,
      sub: (cols[7] || '').replace(/"/g, '').trim(), // LOCATOR column field index 7
      itemNo: '',
      supplierRef: '',
      type: 'fittings'
    });
  }
  return rows;
}

function highlightText(sourceText, query) {
  if (!query) return sourceText;
  let idx = sourceText.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return sourceText;
  return sourceText.substring(0, idx) + 
         '<mark class="match">' + sourceText.substring(idx, idx + query.length) + '</mark>' + 
         sourceText.substring(idx + query.length);
}

function renderResults() {
  var query = searchBox.value.trim();
  var fitQuery = fittingsSearchBox.value.trim();
  
  // Clear the opposite box to make filtering straightforward and elegant
  if (!query && !fitQuery) {
    tableBody.innerHTML = '';
    tableWrap.style.display = 'block';
    noResults.style.display = 'none';
    updateMetaDisplay();
    return;
  }

  var html = '';
  var displayCount = 0;

  if (query) {
    var lowerQuery = query.toLowerCase();
    var activeStock = stockRegistry.filter(r => r.qty > 0);
    var matches = activeStock.filter(function(row) {
      return row.part.toLowerCase().indexOf(lowerQuery) !== -1 || 
             row.itemNo.toLowerCase().indexOf(lowerQuery) !== -1 ||
             row.supplierRef.toLowerCase().indexOf(lowerQuery) !== -1;
    });

    if (matches.length === 0) {
      tableBody.innerHTML = '';
      tableWrap.style.display = 'none';
      noResults.style.display = 'block';
      return;
    }

    tableWrap.style.display = 'block';
    noResults.style.display = 'none';
    displayCount = Math.min(matches.length, 60);
    
    for (var i = 0; i < displayCount; i++) {
      var r = matches[i];
      var displayPart = highlightText(r.part, query);
      var displayItem = r.itemNo ? highlightText(r.itemNo, query) : '';
      var displayRef = r.supplierRef ? highlightText(r.supplierRef, query) : '';

      var descriptionHTML = '<div><strong style="font-size:15px; color:var(--text);">' + displayPart + '</strong></div>';
      if (r.itemNo) descriptionHTML += '<div style="font-size: 11px; color: var(--muted); margin-top: 3px;">Item Number: ' + displayItem + '</div>';
      if (r.supplierRef) descriptionHTML += '<div style="font-size: 11px; color: var(--muted);">Supplier Ref: ' + displayRef + '</div>';
      
      html += '<tr>' +
                '<td class="col-main">' + descriptionHTML + '</td>' +
                '<td class="col-qty"><strong style="font-size: 16px; color:var(--text);">' + r.qty + '</strong></td>' +
                '<td class="col-sub"><span class="location-badge">' + r.sub + '</span></td>' +
              '</tr>';
    }
    metaDisplay.textContent = 'Showing ' + displayCount + ' of ' + matches.length + ' main matches';
  } 
  else if (fitQuery) {
    var lowerFitQuery = fitQuery.toLowerCase();
    var activeFittings = fittingsRegistry.filter(r => r.qty > 0);
    var fitMatches = activeFittings.filter(function(row) {
      return row.part.toLowerCase().indexOf(lowerFitQuery) !== -1;
    });

    if (fitMatches.length === 0) {
      tableBody.innerHTML = '';
      tableWrap.style.display = 'none';
      noResults.style.display = 'block';
      return;
    }

    tableWrap.style.display = 'block';
    noResults.style.display = 'none';
    displayCount = Math.min(fitMatches.length, 60);
    
    for (var j = 0; j < displayCount; j++) {
      var fr = fitMatches[j];
      var displayFitPart = highlightText(fr.part, fitQuery);
      
      var fitDescriptionHTML = '<div><strong style="font-size:15px; color:var(--text);">' + displayFitPart + '</strong></div>';
      fitDescriptionHTML += '<div style="font-size: 11px; color: #8b5cf6; font-weight: 600; margin-top: 3px;">Category: Fittings Stock</div>';

      html += '<tr>' +
                '<td class="col-main">' + fitDescriptionHTML + '</td>' +
                '<td class="col-qty"><strong style="font-size: 16px; color:var(--text);">' + fr.qty + '</strong></td>' +
                '<td class="col-sub"><span class="location-badge fittings-badge">' + fr.sub + '</span></td>' +
              '</tr>';
    }
    metaDisplay.textContent = 'Showing ' + displayCount + ' of ' + fitMatches.length + ' fittings matches';
  }

  tableBody.innerHTML = html;
}

searchBox.addEventListener('input', function() {
  fittingsSearchBox.value = ''; // Auto-clear second box to prevent processing overlaps
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(renderResults, 120);
});

fittingsSearchBox.addEventListener('input', function() {
  searchBox.value = ''; // Auto-clear first box to prevent processing overlaps
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(renderResults, 120);
});

function playBeep(type) {
  try {
    let ctx = new (window.AudioContext || window.webkitAudioContext)();
    let osc = ctx.createOscillator();
    let gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'success') {
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      osc.start(); osc.stop(ctx.currentTime + 0.08);
    } else {
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    }
  } catch(e){}
}

function startScanner() {
  if (html5QrcodeScanner) return;
  html5QrcodeScanner = new Html5Qrcode("reader");
  html5QrcodeScanner.start(
    { facingMode: "environment" },
    { fps: 12, qrbox: { width: 260, height: 160 } },
    onScanSuccess
  ).catch(() => { metaDisplay.textContent = "Camera initialization failed."; });
}

function stopScanner() {
  if (html5QrcodeScanner) {
    html5QrcodeScanner.stop().then(() => { html5QrcodeScanner = null; }).catch(()=>{});
  }
}

function onScanSuccess(decodedText) {
  let scannedQuery = decodedText.trim();
  let scannedQueryLower = scannedQuery.toLowerCase();
  
  let matchedVia = '';
  // Check main registry first
  let match = stockRegistry.find(row => {
    if (row.part.toLowerCase() === scannedQueryLower) { matchedVia = 'Part Number'; return true; }
    if (row.itemNo.toLowerCase() === scannedQueryLower) { matchedVia = 'Item Number'; return true; }
    if (row.supplierRef.toLowerCase() === scannedQueryLower) { matchedVia = 'Supplier Reference'; return true; }
    return false;
  });

  // If not found in main database, cross-reference the new fittings database
  if (!match) {
    match = fittingsRegistry.find(row => {
      if (row.part.toLowerCase() === scannedQueryLower) { matchedVia = 'Fittings Part Number'; return true; }
      return false;
    });
  }

  let qtyInput = document.getElementById('qtyInputField');
  qtyInput.value = '';
  html5QrcodeScanner.pause(true);

  if (match) {
    playBeep('success');
    activeScanMatch = match;
    document.getElementById('targetTitleHeader').textContent = match.type === 'fittings' ? "Matched Fittings Database" : "Matched Database Reference";
    document.getElementById('targetItemName').innerHTML = highlightText(match.part, scannedQuery);
    document.getElementById('targetMappingInfo').textContent = `Cross-Referenced via: ${matchedVia}`;
    document.getElementById('targetSubLoc').textContent = match.sub || 'No SubLocation';
  } else {
    playBeep('error');
    activeScanMatch = { part: `Unregistered Entry [${scannedQuery}]`, itemNo: scannedQuery, sub: 'MANUAL RACK', type: 'unknown' };
    document.getElementById('targetTitleHeader').textContent = "⚠️ NOT FOUND IN DATABASES";
    document.getElementById('targetItemName').textContent = activeScanMatch.part;
    document.getElementById('targetMappingInfo').textContent = "No baseline data match found.";
    document.getElementById('targetSubLoc').textContent = "Unknown SubLocation";
  }

  document.getElementById('countOverlay').style.display = 'block';
  setTimeout(() => { qtyInput.focus(); }, 120);
}

function adjustQty(amount) {
  let input = document.getElementById('qtyInputField');
  let current = parseInt(input.value, 10) || 0;
  input.value = Math.max(0, current + amount);
}

function dismissOverlay() {
  document.getElementById('countOverlay').style.display = 'none';
  activeScanMatch = null;
  if(html5QrcodeScanner) html5QrcodeScanner.resume();
}

function commitCount() {
  let qtyInput = document.getElementById('qtyInputField');
  let countedQty = parseInt(qtyInput.value, 10);

  if (isNaN(countedQty) || countedQty < 0) {
    alert("Please input a valid quantity.");
    return;
  }

  countLogSession.unshift({
    part: activeScanMatch.part,
    itemNo: activeScanMatch.itemNo || '',
    systemSub: activeScanMatch.sub,
    countedQty: countedQty,
    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });

  localStorage.setItem('inv_counts', JSON.stringify(countLogSession));
  renderLogs();
  dismissOverlay();
}

function renderLogs() {
  let listContainer = document.getElementById('logRegistryList');
  document.getElementById('countSession').textContent = `Counts logged: ${countLogSession.length}`;
  
  let html = '';
  countLogSession.forEach((item) => {
    let isUnregistered = item.part.startsWith("Unregistered Entry");
    html += `
      <div class="log-item" style="${isUnregistered ? 'border-left: 4px solid #dc3545;' : 'border-left: 4px solid #10b981;'}">
        <div>
          <strong style="font-size:14px;">${item.part}</strong>
          <div style="font-size:11px; color:var(--muted);">Loc: ${item.systemSub} | Time: ${item.timestamp}</div>
        </div>
        <div style="font-size: 16px; font-weight: bold; color: var(--primary-accent);">× ${item.countedQty}</div>
      </div>
    `;
  });
  listContainer.innerHTML = html;
}

function clearCounts() {
  if (confirm("Clear local count logs from this terminal?")) {
    countLogSession = [];
    localStorage.removeItem('inv_counts');
    renderLogs();
  }
}

function exportCountsToCSV() {
  if (countLogSession.length === 0) return;
  let csvContent = "data:text/csv;charset=utf-8,Part Number,Item Number,System Sublocation,Counted Qty,Timestamp\r\n";
  countLogSession.forEach(row => {
    csvContent += `"${row.part}","${row.itemNo}","${row.systemSub}",${row.countedQty},"${row.timestamp}"\r\n`;
  });
  let link = document.createElement("a");
  link.setAttribute("href", encodeURI(csvContent));
  link.setAttribute("download", `PreCount_${new Date().toISOString().split('T')[0]}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function updateSyncTimestamp() {
  let now = new Date();
  let timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  let dateStr = now.toLocaleDateString([], { month: 'short', day: 'numeric' });
  liveSyncDisplay.textContent = `Live Sync: ${dateStr}, ${timeStr}`;
  localStorage.setItem('ms_last_sync', `Live Sync: ${dateStr}, ${timeStr}`);
}

function fetchDatabases(forceBust = false) {
  let cacheSetting = forceBust ? 'no-store' : 'default';
  let cacheBustToken = '?v=' + new Date().getTime();

  // Fetch file 1: Main Inventory Stocks
  let fetchMain = fetch(CSV_URL + cacheBustToken, { cache: cacheSetting })
    .then(r => r.text())
    .then(text => {
      var freshlyParsed = parseCSV(text);
      if (freshlyParsed.length > 0) {
        stockRegistry = freshlyParsed;
        localStorage.setItem('ms_cache', JSON.stringify(stockRegistry));
      }
    });

  // Fetch file 2: New Fittings Inventory Stocks
  let fetchFittings = fetch(FITTINGS_CSV_URL + cacheBustToken, { cache: cacheSetting })
    .then(r => r.text())
    .then(text => {
      var freshlyParsedFittings = parseFittingsCSV(text);
      if (freshlyParsedFittings.length > 0) {
        fittingsRegistry = freshlyParsedFittings;
        localStorage.setItem('ms_fittings_cache', JSON.stringify(fittingsRegistry));
      }
    });

  Promise.all([fetchMain, fetchFittings])
    .then(() => {
      updateMetaDisplay();
      updateSyncTimestamp();
      if (searchBox.value || fittingsSearchBox.value) renderResults();
      if (forceBust) alert("All database caches flushed successfully. System fully up-to-date.");
    })
    .catch(() => {
      let cachedTime = localStorage.getItem('ms_last_sync') || 'Offline mode';
      liveSyncDisplay.textContent = `${cachedTime} (Cached)`;
    });
}

function clearAppCache() {
  if (confirm("Force refresh and sync a fresh copy of all stock files from GitHub?")) {
    fetchDatabases(true);
  }
}

themeToggle.addEventListener('change', function() {
  let isDark = themeToggle.checked;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  localStorage.setItem('ms_theme', isDark ? 'dark' : 'light');
  
  if (isDark) {
    document.documentElement.style.setProperty('--bg', '#0f1115');
  } else {
    applyBackgroundTone(accentColorPicker.value);
  }
});

(function init() {
  var savedTheme = localStorage.getItem('ms_theme') || 'light';
  themeToggle.checked = (savedTheme === 'dark');
  document.documentElement.setAttribute('data-theme', savedTheme);

  var savedBgTone = localStorage.getItem('ms_bg_hex') || '#f4f6f9';
  accentColorPicker.value = savedBgTone;
  applyBackgroundTone(savedBgTone);

  var savedSession = localStorage.getItem('inv_counts');
  if (savedSession) {
    countLogSession = JSON.parse(savedSession);
    renderLogs();
  }

  var cachedData = localStorage.getItem('ms_cache');
  if (cachedData) {
    stockRegistry = JSON.parse(cachedData);
  }
  
  var cachedFittings = localStorage.getItem('ms_fittings_cache');
  if (cachedFittings) {
    fittingsRegistry = JSON.parse(cachedFittings);
  }
  
  updateMetaDisplay();
  if (localStorage.getItem('ms_last_sync')) {
    liveSyncDisplay.textContent = localStorage.getItem('ms_last_sync');
  }

  fetchDatabases(false);
})();
</script>
</body>
</html>
